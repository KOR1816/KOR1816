<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>KOR1816 API 프로필 사진 테스트</title>
<style>
*{box-sizing:border-box}body{margin:0;padding:28px 16px;background:#0b1422;color:#eef5ff;font-family:system-ui,"Noto Sans KR",sans-serif}main{max-width:760px;margin:auto;padding:24px;border:1px solid #31435b;border-radius:18px;background:#111e30}h1{font-size:23px;margin:0 0 8px}p{color:#aebfd4;line-height:1.65}.profile{display:flex;gap:20px;align-items:center;flex-wrap:wrap;margin:22px 0;padding:18px;background:#0b1422;border-radius:14px}.avatar{width:144px;height:144px;border-radius:18px;object-fit:cover;background:#24344a;border:1px solid #506783}.status{padding:12px;border-radius:10px;background:#1a2a40;white-space:pre-wrap;overflow-wrap:anywhere}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#08111d;padding:14px;border-radius:10px;font-size:12px;color:#c8d8eb;max-height:360px;overflow:auto}button{background:#e6c98d;border:0;border-radius:9px;padding:11px 15px;font-weight:800;cursor:pointer}small{color:#8ea5bf}
</style></head><body><main><h1>API 프로필 사진 테스트</h1><p>게임 ID <strong>277809051</strong>의 공개 프로필을 API로 조회합니다. 이 페이지는 테스트 전용이며 기존 홈·참가 명단·사진 데이터를 변경하지 않습니다.</p>
<button id="reload">다시 조회</button><p id="status" class="status">API 조회 준비 중…</p>
<section id="result" hidden><div class="profile"><img id="avatar" class="avatar" alt="API 프로필 사진"><div><h2 id="name">프로필</h2><p id="meta"></p><small id="imageSource"></small></div></div><h3>사진 관련 API 필드</h3><pre id="fields"></pre><details><summary>API 응답 확인</summary><pre id="raw"></pre></details></section>
</main><script>
const API='https://kor1816-api.to1ggi8410.workers.dev/api/profile';
const $=id=>document.getElementById(id);
function findPhotoFields(obj,path='',out=[],depth=0){if(!obj||typeof obj!=='object'||depth>5)return out;for(const [k,v] of Object.entries(obj)){const p=path?path+'.'+k:k;if(typeof v==='string'&&/(avatar|photo|portrait|head|profile.?pic|image|icon)/i.test(k)){out.push({key:p,value:v});}else if(v&&typeof v==='object')findPhotoFields(v,p,out,depth+1)}return out}
async function load(){ $('status').textContent='API 조회 중…';$('result').hidden=true;try{const res=await fetch(API+'?id=277809051',{headers:{Accept:'application/json'}});const data=await res.json();if(!res.ok||!data?.ok||!data?.player)throw Error(data?.error||('HTTP '+res.status));const p=data.player;const photos=findPhotoFields(p);const usable=photos.find(x=>/^https?:\/\//i.test(x.value)&&/avatar|photo|portrait|head|profile.?pic|image|icon/i.test(x.key));$('name').textContent=p.nickname||p.name||p.player_name||('Game ID 277809051');$('meta').textContent='왕국: '+(p.kid??p.kingdom_id??p.kingdomId??p.kingdom??'정보 없음')+' · 연맹: '+(p.alliance?.abbr??p.alliance?.tag??p.alliance_tag??'정보 없음');$('fields').textContent=photos.length?photos.map(x=>x.key+'\n'+x.value).join('\n\n'):'사진으로 추정되는 문자열 필드를 찾지 못했습니다.';$('raw').textContent=JSON.stringify(data,null,2);if(usable){$('avatar').src=usable.value;$('imageSource').textContent='사진 필드: '+usable.key;$('avatar').onerror=()=>{$('imageSource').textContent='사진 주소는 확인했지만 브라우저에서 이미지를 불러오지 못했습니다: '+usable.key};}else{$('avatar').removeAttribute('src');$('imageSource').textContent='API 응답에서 이미지 URL 필드를 아직 찾지 못했습니다.'}$('result').hidden=false;$('status').textContent='API 응답 성공. 사진 필드 확인 결과를 아래에 표시했습니다.';}catch(e){$('status').textContent='조회 실패: '+e.message+'\nAPI 접근 또는 응답 형식을 확인해야 합니다.'}}
$('reload').addEventListener('click',load);load();
</script></body></html>
