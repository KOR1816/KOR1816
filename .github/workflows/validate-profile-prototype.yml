name: Validate KOR1816 profile page

on:
  pull_request:
    branches: [main]
    paths:
      - "profile.html"
      - ".github/workflows/validate-profile-prototype.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-profile-page:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Check profile page inline JavaScript syntax
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync, writeFileSync } from 'node:fs';
          const html = readFileSync('profile.html', 'utf8');
          const scripts = [...html.matchAll(/<script\b[^>]*>([\s\\S]*?)<\/script>/gi)];
          if (!scripts.length) throw new Error('No inline script found in profile.html');
          writeFileSync('/tmp/kor1816-profile-inline.js', scripts.map(m => m[1]).join('\n'));
          NODE
          node --check /tmp/kor1816-profile-inline.js

      - name: Check essential profile lookup controls
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          const html = readFileSync('profile.html', 'utf8');
          for (const item of [
            'kor1816-api.to1ggi8410.workers.dev/api/profile',
            'search-form',
            'player-id',
            'heroTitle',
            'gearTitle',
            'rankTitle'
          ]) {
            if (!html.includes(item)) throw new Error('Missing profile feature: ' + item);
          }
          console.log('Profile page checks passed.');
          NODE
