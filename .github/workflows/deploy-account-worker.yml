name: Deploy KOR1816 account Worker

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy account-link Worker
    runs-on: ubuntu-latest
    environment: account-worker-test
    steps:
      - name: Checkout selected branch
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Validate required deployment settings
        env:
          CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          KV_NAMESPACE_ID: ${{ secrets.CLOUDFLARE_KV_NAMESPACE_ID }}
          APP_ORIGIN: ${{ vars.ACCOUNT_WORKER_APP_ORIGIN }}
          OAUTH_REDIRECT_URI: ${{ vars.ACCOUNT_WORKER_REDIRECT_URI }}
        run: |
          set -euo pipefail
          test -n "$CF_ACCOUNT_ID" || { echo "Missing CLOUDFLARE_ACCOUNT_ID secret"; exit 1; }
          test -n "$CF_API_TOKEN" || { echo "Missing CLOUDFLARE_API_TOKEN secret"; exit 1; }
          test -n "$KV_NAMESPACE_ID" || { echo "Missing CLOUDFLARE_KV_NAMESPACE_ID secret"; exit 1; }
          test -n "$APP_ORIGIN" || { echo "Missing ACCOUNT_WORKER_APP_ORIGIN repository variable"; exit 1; }
          test -n "$OAUTH_REDIRECT_URI" || { echo "Missing ACCOUNT_WORKER_REDIRECT_URI repository variable"; exit 1; }
          case "$APP_ORIGIN" in https://*) ;; *) echo "APP_ORIGIN must use HTTPS"; exit 1;; esac
          case "$OAUTH_REDIRECT_URI" in https://*/auth/callback) ;; *) echo "OAUTH_REDIRECT_URI must be an HTTPS callback URL ending in /auth/callback"; exit 1;; esac

      - name: Write temporary Wrangler config
        env:
          KV_NAMESPACE_ID: ${{ secrets.CLOUDFLARE_KV_NAMESPACE_ID }}
          APP_ORIGIN: ${{ vars.ACCOUNT_WORKER_APP_ORIGIN }}
          OAUTH_REDIRECT_URI: ${{ vars.ACCOUNT_WORKER_REDIRECT_URI }}
        run: |
          set -euo pipefail
          cat > wrangler.toml <<EOF
          name = "kor1816-account-link"
          main = "profile-api/account-worker.js"
          compatibility_date = "2026-10-20"

          [[kv_namespaces]]
          binding = "OAUTH_STORE"
          id = "$KV_NAMESPACE_ID"

          [vars]
          APP_ORIGIN = "$APP_ORIGIN"
          OAUTH_REDIRECT_URI = "$OAUTH_REDIRECT_URI"
          EOF

      - name: Deploy Worker to Cloudflare
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npx --yes wrangler@4 deploy --config wrangler.toml
