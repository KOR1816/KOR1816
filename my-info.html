function renderHeroes(data){const heroes=Array.isArray(data.heroes)?data.heroes:[];const html=heroes.map(h=>{const name=gameLabel(h.name||'Hero'),icon=imgUrl(h.icon),gear=Array.isArray(h.gear)?h.gear:[],exclusive=h.exclusive_gear||{},star=h.star_label||h.stars||h.star||'—';const exId=first(exclusive,['eid','equipment_id','equipmentId','item_id','itemId','id']);const exIcon=gearImage(exclusive)|| (exId==null?'':'https://www.mightpulse.com/assets/icons/equipment_icon_'+exId+'.png');return '<article class="hero-card"><div class="hero-title">'+(icon?'<img class="hero-icon" src="'+esc(icon)+'" alt="" loading="lazy" onerror="this.remove()">':'')+'<div style="min-width:0"><div class="hero-name">'+esc(name)+'</div><div class="hero-info">'+esc(T.levelLabel)+' '+esc(fmt(h.level))+' · '+esc(T.starLabel)+' '+esc(star)+'</div></div>'+(exclusive.name||exIcon?'<div class="hero-exclusive-item '+(gearQuality(exclusive)?'quality-'+gearQuality(exclusive):'')+'">'+(exIcon?'<img class="hero-gear-image" src="'+esc(exIcon)+'" alt="" loading="lazy" onerror="this.remove()">':'')+'<div class="gear-item-name">'+esc(gameLabel(exclusive.name)||T.exclusive)+'</div><div class="gear-item-level">Lv. '+esc(fmt(exclusive.level??h.exclusive_gear_level??0))+'</div></div>':'')+'</div>'+(gear.length?'<div class="hero-gear-grid">'+gear.map(item=>{const slot=gearSlot(item),img=gearImage(item),quality=gearQuality(item),enh=first(item,['enhancement_level','gear_level','strength_level','level']),ref=first(item,['refine_level','refinement_level','star']);return '<div class="hero-gear-item '+(quality?'quality-'+quality:'')+'">'+(img?'<img class="hero-gear-image" src="'+esc(img)+'" alt="'+esc(gameLabel(slotNames[slot]||slot))+'" loading="lazy" onerror="this.remove()">':'<div class="hero-gear-symbol">'+esc(slotIcons[slot]||'◇')+'</div>')+'<div class="gear-item-name">'+esc(gameLabel(slotNames[slot]||slot))+'</div><div class="gear-item-level">+'+esc(fmt(enh))+'</div><div class="gear-item-name">'+esc(T.refine)+' '+esc(fmt(ref))+'</div></div>'}).join('')+'</div>':'<div class="gear-empty">'+esc(T.heroMissing)+'</div>')+'</article>'}).join('');$('heroGear').innerHTML=html||'<div class="empty">'+esc(T.heroMissing)+'</div>'}

const ROSTER_IDS=["277646867","279366155","273178050","280841541","272302196","262615089","272947841","271532528","279072727","279234965","278136872","261763324","279367354","269885273","269230772","254167456","277220188","253430709","252823945","277809051","277630478","277565244","270257167","272337940","275747145","279498200","270726183","271966460","278531764","261778876","273258930","277088890","280660595","278759624","270879682","279367558","279562732","278466567","269372902","270443090","279218125","276336897","278416482","280661086","275985582","271688441","277711710","270254362","279137266","264548253","270680423","277383097","256940953","278366666","259097364","264023958","280825224","259425117","259861537","280186422","277350446","279333024","273229188","279776591","269017528","277695498","280431947","272631641","262795207","276323629","272852827","280578852","280644519","279956548","277548000","278416124","279612331","277546906","261799305","279136817","277941037","279285182","280479953","279629382","277252686","277531970","279972554","278530645","279908393","279662322","253577480","278498878","278530654","277170530","277269174","280825692","269869267"];
const ROSTER_CACHE_HOURS=12;
function trialScore(data){const r=data?.ranks||data?.rankings||{};const p=data?.player||data?.profile||{};const v=first(r,['mystic_trial','mysticTrial','trial_score','trialScore','mystic_trial_score','mysticTrialScore'])??first(p,['mystic_trial','mysticTrial','trial_score','trialScore','mystic_trial_score','mysticTrialScore']);if(v&&typeof v==='object')return first(v,['score','points','value','progress','current','total']);return v}
function cachedRosterProfile(gameId){try{const raw=localStorage.getItem('kor1816_roster_'+gameId);if(!raw)return null;const item=JSON.parse(raw);if(!item||Date.now()-item.savedAt>ROSTER_CACHE_HOURS*3600000)return null;return item.data}catch{return null}}
async function getRosterProfile(gameId){const cached=cachedRosterProfile(gameId);if(cached)return {id:gameId,data:cached,cached:true};const response=await fetch(API+'?id='+encodeURIComponent(gameId)+'&t='+Date.now(),{headers:{Accept:'application/json'},cache:'no-store'});const data=await response.json();if(!response.ok||!data?.ok||!data?.player)throw new Error(data?.error||'profile');const p=data.player||{},summary={player:{governor_id:p.governor_id||p.fid||p.uid,nick_name:p.nick_name||p.nickname||p.name,avatar_url:p.avatar_url||p.avatar,power:p.power},ranks:{mystic_trial:trialScore(data)}};try{localStorage.setItem('kor1816_roster_'+gameId,JSON.stringify({savedAt:Date.now(),data:summary}))}catch{}return {id:gameId,data:summary,cached:false}}
async function loadRosterRank(ownId,ownData){const ids=[...new Set([...ROSTER_IDS,String(ownId)])];const profiles=[];let cursor=0,done=0;async function worker(){while(cursor<ids.length){const idx=cursor++,gameId=ids[idx];try{const data=String(gameId)===String(ownId)?ownData:(await getRosterProfile(gameId)).data;const score=trialScore(data);if(score!==null&&score!==undefined&&score!==''&&Number.isFinite(Number(score)))profiles.push({id:String(gameId),score:Number(score)})}catch{}done++;if(done%10===0||done===ids.length)$('status').textContent=T.rankProgress+' '+done+'/'+ids.length}}await Promise.all(Array.from({length:12},worker));const ownScore=trialScore(ownData);if(ownScore===null||ownScore===undefined||ownScore===''||!Number.isFinite(Number(ownScore)))return {score:null,rank:null,count:profiles.length};const score=Number(ownScore);if(!profiles.some(x=>x.id===String(ownId)))profiles.push({id:String(ownId),score});const higher=profiles.filter(x=>x.score>score).length;return {score,rank:higher+1,count:profiles.length}}
function renderProfile(data){const p=data.player||data.profile||{},a=p.alliance||{},name=p.nick_name||p.nickname||p.name||'KOR1816';$('playerName').textContent=name;const avatar=imgUrl(p.avatar_url||p.avatar);$('avatarWrap').outerHTML=avatar?'<img class="avatar" id="avatarWrap" src="'+esc(avatar)+'" alt="" onerror="this.style.display=\'none\'">':'<div id="avatarWrap" class="avatar avatar-fallback">K</div>';$('playerMeta').textContent=T.id+': '+fmt(p.governor_id||p.fid||p.uid)+' · '+T.kingdom+' '+fmt(p.kid)+' · '+T.alliance+' '+fmt(a.abbr||a.name);$('pills').innerHTML='<span class="pill">'+esc(a.name||'KOR')+'</span><span class="pill">'+esc(T.memberCount+' '+fmt(a.count))+'</span>';
const power=first(p,['power']),tc=first(p,['town_center_level']);const tg=tc!=null&&Number(tc)>=55?'TG5':tc!=null?'TG'+Math.max(1,Math.floor(Number(tc)/10)):'—';const ranks=data.ranks||{};const trial=trialScore(data);$('stats').innerHTML=[metric(T.power,fmt(power)),metric(T.level,tg),metric(T.trial,trial!=null?fmt(trial):'—',T.rankProgress)].join('');
renderLord(data);renderHeroes(data);$('status').textContent=T.success+' · '+new Date().toLocaleString(lang==='ko'?'ko-KR':lang==='ja'?'ja-JP':'en-US');
loadRosterRank(p.governor_id||p.fid||p.uid,data).then(result=>{const value=result.rank?String(result.rank)+(T.rankPosition||''):'—';const subtitle=result.rank?(lang==='ko'?'현재 확인된 '+result.count+'명 중 '+result.rank+'위':lang==='ja'?result.count+'人中 '+result.rank+T.rankPosition:lang==='zh'?result.count+'人中 '+result.rank+'名':lang==='de'?'Rang '+result.rank+' von '+result.count:lang==='it'?result.rank+'° su '+result.count:lang==='es'?result.rank+' de '+result.count:lang==='tr'?result.count+' üye arasında '+result.rank+'.':'Rank '+result.rank+' of '+result.count+' '+T.rankMembers):(lang==='ko'?'시련 점수 데이터 없음':lang==='ja'?'順位に必要な試練スコアがありません':lang==='zh'?'缺少排名所需的试炼分数':lang==='de'?'Prüfungspunktzahl für Rang fehlt':lang==='it'?'Punteggio prova non disponibile':lang==='es'?'Falta la puntuación de prueba':lang==='tr'?'Sıralama için deneme puanı yok':'Trial score unavailable for ranking');$('stats').innerHTML=[metric(T.power,fmt(power)),metric(T.level,tg),metric(T.trial,trial!=null?fmt(trial):'—',subtitle)].join('')}).catch(()=>{})}

let id='';
async function fetchProfile(candidate){const response=await fetch(API+'?id='+encodeURIComponent(candidate)+'&t='+Date.now(),{headers:{Accept:'application/json'},cache:'no-store'});const data=await response.json();if(!response.ok||!data?.ok||!data?.player)throw new Error(data?.error||'profile');return data}
async function load(){if(localStorage.getItem('kor1816_member_ok')!=='1816:KOR'){location.replace('./profile-preview.html?return=home');return}id=localStorage.getItem('kor1816_member_game_id')||sessionStorage.getItem('kor1816_member_game_id')||'';if(!/^\d{4,20}$/.test(id)){$('status').textContent=T.noid;$('linkForm').hidden=false;$('refresh').disabled=true;return}$('linkForm').hidden=true;$('refresh').disabled=true;$('status').textContent=T.loading;try{renderProfile(await fetchProfile(id))}catch(e){$('status').textContent=T.failed}finally{$('refresh').disabled=false}}
$('linkForm').addEventListener('submit',async e=>{e.preventDefault();const candidate=$('linkId').value.trim();if(!/^\d{4,20}$/.test(candidate)){$('status').textContent=T.invalidId;return}const submit=$('linkSubmit');submit.disabled=true;$('status').textContent=T.checking;try{const data=await fetchProfile(candidate),p=data.player,a=p.alliance||{};if(String(p.kid)!=='1816'||String(a.abbr||a.tag||'')!=='KOR')throw new Error(T.linkError);localStorage.setItem('kor1816_member_game_id',candidate);sessionStorage.setItem('kor1816_member_game_id',candidate);await load()}catch(err){$('status').textContent=err.message||T.failed}finally{submit.disabled=false}});
$('refresh').addEventListener('click',load);load();
