<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0b1020"><title>KOR1816 | 내정보</title>
<style>
:root{color-scheme:dark;--bg:#090f1c;--panel:#121d30;--panel2:#0d1728;--line:#2a3d5c;--gold:#f0cb70;--gold2:#b98b3d;--text:#f3f6ff;--muted:#9caec9;--blue:#9bd8ff;--green:#8ce2bc}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 50% -15%,#23395c 0,#0a1120 48%,#070c16 100%);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI","Malgun Gothic",sans-serif;min-height:100vh}.wrap{width:min(1120px,100%);margin:auto;padding:18px 16px 42px}.top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;padding:5px 0 16px;border-bottom:1px solid #2b3b56}.brand{font-size:19px;font-weight:950;letter-spacing:.08em}.brand small{display:block;color:var(--muted);font-size:11px;font-weight:500;letter-spacing:.03em;margin-top:4px}.actions{display:flex;gap:8px;flex-wrap:wrap}button,.link{display:inline-flex;align-items:center;justify-content:center;border:1px solid #3a5072;border-radius:10px;background:#14223a;color:var(--text);padding:10px 13px;font-weight:800;text-decoration:none;cursor:pointer;font:inherit;font-size:13px}button.primary{background:linear-gradient(135deg,#f5dc91,#c79b48);color:#172033;border-color:#e8c76e;font-weight:900}button:disabled{opacity:.6;cursor:wait}.profile-head{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:18px;margin:20px 0 14px;padding:20px;border:1px solid #3a4d6b;border-radius:18px;background:linear-gradient(120deg,#1a2a45ed,#0e1829f5);box-shadow:0 14px 34px #0003}.avatar{width:92px;height:92px;object-fit:cover;border-radius:17px;border:2px solid #c7a95d;background:#1a2940}.avatar-fallback{display:grid;place-items:center;font-size:30px;color:var(--gold)}h1{font-size:clamp(24px,4vw,34px);margin:0 0 7px;letter-spacing:-.035em}.meta{color:#bdcbe0;font-size:13px;line-height:1.8;overflow-wrap:anywhere}.pills{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}.pill{border:1px solid #3b5274;background:#0b1628;border-radius:999px;padding:4px 9px;font-size:11px;color:#d7e5fb}.status{grid-column:1/-1;color:var(--blue);font-size:12px;white-space:pre-wrap;min-height:16px}.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin:12px 0 22px}.stat{position:relative;overflow:hidden;min-width:0;padding:16px;border:1px solid var(--line);border-radius:14px;background:linear-gradient(145deg,#172641,#0d1728)}.stat:before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:linear-gradient(var(--gold),#886b35)}.stat span{display:block;color:var(--muted);font-size:12px;margin-bottom:8px}.stat strong{display:block;font-size:clamp(20px,3vw,27px);line-height:1.15;overflow-wrap:anywhere;letter-spacing:-.025em}.stat small{display:block;color:var(--blue);font-size:11px;margin-top:7px}.section-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:25px 0 11px}.section-head h2{font-size:19px;margin:0;color:var(--gold);letter-spacing:-.02em}.section-head span{color:var(--muted);font-size:11px}.panel{border:1px solid var(--line);border-radius:15px;background:linear-gradient(145deg,#142039,#0b1423);padding:15px}.empty{padding:18px;border:1px dashed #435778;border-radius:13px;color:var(--muted);line-height:1.65;background:#0c1627}.lord-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}.lord-item{border:1px solid #354b6c;background:#0b1525;border-radius:13px;padding:12px;text-align:center;min-width:0}.lord-item img{width:60px;height:60px;object-fit:contain;display:block;margin:0 auto 9px;filter:drop-shadow(0 4px 8px #0008)}.lord-item strong{display:block;font-size:12px;color:#f3d98d;overflow-wrap:anywhere}.lord-item .sub{font-size:11px;color:#aebdd4;margin-top:6px;line-height:1.5}.hero-list{display:grid;gap:13px}.hero-card{border:1px solid #354b6b;border-radius:15px;background:linear-gradient(135deg,#142139,#0b1424);overflow:hidden}.hero-title{display:flex;align-items:center;gap:12px;padding:13px 15px;border-bottom:1px solid #2a3b56;background:#172640}.hero-icon{width:58px;height:58px;object-fit:contain;border-radius:11px;background:#0a1322;border:1px solid #344966;padding:3px;flex:none}.hero-name{font-size:16px;font-weight:900}.hero-info{color:var(--muted);font-size:11px;margin-top:4px}.exclusive{margin-left:auto;text-align:right;color:#f0d58b;font-size:11px;line-height:1.55}.gear-slots{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;padding:12px}.gear-slot{display:flex;gap:9px;align-items:center;min-width:0;padding:9px;border:1px solid #293d5b;border-radius:11px;background:#0a1424}.slot-icon{width:42px;height:42px;display:grid;place-items:center;flex:none;border:1px solid #445978;border-radius:9px;background:linear-gradient(145deg,#263b5b,#101c30);font-size:20px}.gear-slot.red{border-color:#7d484d;background:linear-gradient(145deg,#301c29,#0c1423)}.gear-slot.red .slot-icon{border-color:#a65359;background:#4a202a}.gear-slot .gear-name{font-size:11px;font-weight:800;line-height:1.35;overflow-wrap:anywhere}.gear-slot .gear-meta{font-size:10px;color:var(--muted);line-height:1.55;margin-top:4px}.no-gear{padding:13px;color:var(--muted);font-size:12px}.foot{margin-top:26px;color:#7588a6;text-align:center;font-size:11px;line-height:1.7}form#linkForm{margin-top:14px}#linkId{flex:1;min-width:180px;border:1px solid #405878;border-radius:10px;background:#081222;color:white;padding:11px;font:inherit}
@media(max-width:700px){.profile-head{grid-template-columns:auto 1fr;padding:15px;gap:12px}.avatar{width:74px;height:74px}.profile-head .actions{grid-column:1/-1}.status{grid-column:1/-1}.stats{grid-template-columns:repeat(2,minmax(0,1fr))}.gear-slots{grid-template-columns:repeat(2,minmax(0,1fr))}.lord-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:390px){.wrap{padding:12px 10px 30px}.hero-title{padding:10px;gap:9px}.hero-icon{width:48px;height:48px}.hero-name{font-size:14px}.exclusive{font-size:10px}.gear-slots{gap:6px;padding:8px}.gear-slot{padding:7px;gap:6px}.slot-icon{width:34px;height:34px;font-size:17px}.gear-slot .gear-name{font-size:10px}}
</style></head>
<body><main class="wrap">
<header class="top"><div class="brand">KOR1816<small>KINGDOM 1816 · BEAUTYXBEAST</small></div><div class="actions"><a class="link" href="./index.html?space=1816#home" id="back">← 메인으로</a><button class="primary" id="refresh">↻ 정보 새로고침</button></div></header>
<section class="profile-head"><div id="avatarWrap" class="avatar avatar-fallback">K</div><div><h1 id="playerName">내정보</h1><div class="meta" id="playerMeta">로그인한 게임 ID의 프로필을 조회합니다.</div><div class="pills" id="pills"></div></div><div class="actions"><span class="pill">KOR · 1816</span></div><div class="status" id="status" role="status" aria-live="polite">프로필을 준비하고 있습니다…</div>
<form id="linkForm" class="panel" hidden><label for="linkId" class="meta">게임 ID가 저장되지 않았다면 한 번만 입력해 주세요. 서버 1816 및 연맹 KOR 확인 후 연결합니다.</label><div class="actions" style="margin-top:10px"><input id="linkId" inputmode="numeric" autocomplete="off" placeholder="킹샷 게임 ID" required><button class="primary" id="linkSubmit" type="submit">ID 확인 및 연결</button></div></form></section>
<div class="stats" id="stats"></div>
<div class="section-head"><h2>영주 장비</h2><span>GOVERNOR EQUIPMENT</span></div><div id="lordGear"></div>
<div class="section-head"><h2>영웅 장비</h2><span>HERO EQUIPMENT</span></div><div id="heroGear" class="hero-list"></div>
<p class="foot">조회 가능한 공개 프로필 정보만 표시합니다. 영주 장비가 비공개인 경우 장비 목록은 표시되지 않습니다.<br>KOR1816 · My Info</p>
</main>
<script>
const API='https://kor1816-api.to1ggi8410.workers.dev/api/profile';
const $=id=>document.getElementById(id);
const params=new URLSearchParams(location.search);
const lang=params.get('lang')||localStorage.getItem('kor1816_rebuild_lang_v1')||'ko';
const words={ko:{back:'← 메인으로',refresh:'↻ 정보 새로고침',loading:'최신 프로필 정보를 조회하고 있습니다…',noid:'저장된 로그인 게임 ID가 없습니다. 아래에 ID를 입력해 연결해 주세요.',failed:'정보를 불러오지 못했습니다. 잠시 후 다시 시도해 주세요.',power:'전투력',level:'센터 레벨',trial:'시련 점수',trialRank:'KOR 99명 중 시련 점수 순위',kingdom:'왕국',alliance:'연맹',id:'게임 ID',lordPrivate:'영주 장비 비공개',lordMissing:'영주 장비 정보가 제공되지 않았습니다.',heroMissing:'영웅 장비 정보가 없습니다.',levelLabel:'레벨',starLabel:'성급',exclusive:'전용 장비',enhance:'강화',refine:'정련',helmet:'투구',gloves:'장갑',armor:'갑옷',boots:'신발',linkError:'서버 1816 및 연맹 KOR 소속이 확인되지 않았습니다.'},en:{back:'← Home',refresh:'↻ Refresh',loading:'Loading latest profile…',noid:'No saved Game ID. Enter it below to link your profile.',failed:'Could not load profile. Please try again.',power:'Power',level:'Center Level',trial:'Trial Score',trialRank:'Trial score rank among KOR 99',kingdom:'Kingdom',alliance:'Alliance',id:'Game ID',lordPrivate:'Governor gear is private',lordMissing:'Governor gear data is unavailable.',heroMissing:'No hero gear data available.',levelLabel:'Level',starLabel:'Stars',exclusive:'Exclusive gear',enhance:'Enhancement',refine:'Refinement',helmet:'Helmet',gloves:'Gloves',armor:'Armor',boots:'Boots',linkError:'Kingdom 1816 and alliance KOR could not be verified.'}};
const T=words[lang]||words.ko;
$('back').textContent=T.back;$('refresh').textContent=T.refresh;
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function first(o,keys){for(const k of keys)if(o&&o[k]!==undefined&&o[k]!==null&&o[k]!=='')return o[k];return null}
function fmt(v){return v===null||v===undefined||v===''?'—':typeof v==='number'?v.toLocaleString():String(v)}
function metric(label,value,sub=''){return '<div class="stat"><span>'+esc(label)+'</span><strong>'+esc(value)+'</strong>'+(sub?'<small>'+esc(sub)+'</small>':'')+'</div>'}
function imgUrl(path){if(!path)return '';if(/^https?:\/\//i.test(path))return path;if(path.startsWith('/'))return 'https://www.mightpulse.com'+path;return 'https://www.mightpulse.com/'+path}
const slotNames={Helmet:T.helmet,Gloves:T.gloves,Armor:T.armor,Boots:T.boots};
const slotIcons={Helmet:'♜',Gloves:'♧',Armor:'◈',Boots:'⬟'};
function gearLevel(g){return first(g,['enhancement_level','gear_level','level'])}
function gearSlot(g){return first(g,['slot','type','part'])||'Gear'}
function gearCard(g){const slot=gearSlot(g),quality=first(g,['quality_label','tier'])||'',enh=gearLevel(g),ref=first(g,['refine_level','refinement_level']);const red=!!g.red||String(g.quality_key||'').toLowerCase()==='legendary';return '<div class="gear-slot '+(red?'red':'')+'"><div class="slot-icon">'+esc(slotIcons[slot]||'◇')+'</div><div style="min-width:0"><div class="gear-name">'+esc(first(g,['name','title'])||slotNames[slot]||slot)+'</div><div class="gear-meta">'+(quality?esc(quality)+'<br>':'')+(enh!==null?esc(T.enhance)+' +'+esc(fmt(enh)):'')+(ref!==null?' · '+esc(T.refine)+' '+esc(fmt(ref)):'')+'</div></div></div>'}
function renderLord(data){const box=$('lordGear'),g=data.gov_gear||data.governor_gear||data.lord_gear||{};if(g.hidden){box.innerHTML='<div class="empty"><strong>'+esc(T.lordPrivate)+'</strong><br>'+esc(g.message||T.lordMissing)+'</div>';return}const items=Array.isArray(g)?g:(Array.isArray(g.items)?g.items:[]);if(!items.length){box.innerHTML='<div class="empty">'+esc(T.lordMissing)+'</div>';return}box.innerHTML='<div class="lord-grid">'+items.map((x,i)=>{const slot=x.slot||['Helmet','Gloves','Armor','Boots'][i]||'Gear';const icon=imgUrl(x.icon||x.image||('/assets/icons/lordsequipment_icon_'+(i+1)+'001.png'));return '<div class="lord-item"><img src="'+esc(icon)+'" alt="" onerror="this.style.display=\'none\'"><strong>'+esc(x.name||slotNames[slot]||slot)+'</strong><div class="sub">'+esc(T.enhance)+' +'+esc(fmt(gearLevel(x)))+'<br>'+esc(T.refine)+' '+esc(fmt(x.refine_level))+'</div></div>'}).join('')+'</div>'}
function renderHeroes(data){const heroes=Array.isArray(data.heroes)?data.heroes:[];const html=heroes.map(h=>{const name=h.name||'Hero',icon=imgUrl(h.icon),gear=Array.isArray(h.gear)?h.gear:[],exclusive=h.exclusive_gear||{},star=h.star_label||h.stars||h.star||'—';return '<article class="hero-card"><div class="hero-title">'+(icon?'<img class="hero-icon" src="'+esc(icon)+'" alt="" onerror="this.style.display=\'none\'">':'<div class="hero-icon"></div>')+'<div style="min-width:0"><div class="hero-name">'+esc(name)+'</div><div class="hero-info">'+esc(T.levelLabel)+' '+esc(fmt(h.level))+' · '+esc(T.starLabel)+' '+esc(star)+'</div></div><div class="exclusive">'+esc(T.exclusive)+'<br><b>'+esc(exclusive.name||'—')+'</b>'+(h.exclusive_gear_level!=null?'<br>Lv. '+esc(fmt(h.exclusive_gear_level)):'')+'</div></div>'+(gear.length?'<div class="gear-slots">'+gear.map(gearCard).join('')+'</div>':'<div class="no-gear">'+esc(T.heroMissing)+'</div>')+'</article>'}).join('');$('heroGear').innerHTML=html||'<div class="empty">'+esc(T.heroMissing)+'</div>'}
function renderProfile(data){const p=data.player||data.profile||{},a=p.alliance||{},name=p.nick_name||p.nickname||p.name||'KOR1816';$('playerName').textContent=name;const avatar=imgUrl(p.avatar_url||p.avatar);$('avatarWrap').outerHTML=avatar?'<img class="avatar" id="avatarWrap" src="'+esc(avatar)+'" alt="" onerror="this.style.display=\'none\'">':'<div id="avatarWrap" class="avatar avatar-fallback">K</div>';$('playerMeta').textContent=T.id+': '+fmt(p.governor_id||p.fid||p.uid)+' · '+T.kingdom+' '+fmt(p.kid)+' · '+T.alliance+' '+fmt(a.abbr||a.name);$('pills').innerHTML='<span class="pill">'+esc(a.name||'KOR')+'</span><span class="pill">'+esc(a.rank_label||'')+'</span><span class="pill">'+esc('연맹원 '+fmt(a.count))+'</span>';
const power=first(p,['power']),tc=first(p,['town_center_level']);const tg=tc!=null&&Number(tc)>=55?'TG5':tc!=null?'TG'+Math.max(1,Math.floor(Number(tc)/10)):'—';const ranks=data.ranks||{};const trial=first(ranks,['mystic_trial','mysticTrial','trial_score','trialScore']);const trialRank=first(ranks,['mystic_rank','mysticRank','trial_rank','trialRank']);$('stats').innerHTML=[metric(T.power,fmt(power)),metric(T.level,tg,tc!=null?'Town Center Lv. '+fmt(tc):''),metric(T.trial,trial!=null?fmt(trial):'—',trialRank!=null?'왕국 순위 '+fmt(trialRank)+'위':'KOR 99명 순위는 전체 회원 데이터 확인 후 표시')].join('');
renderLord(data);renderHeroes(data);$('status').textContent='조회 성공 · '+new Date().toLocaleString()}
let id='';
async function fetchProfile(candidate){const response=await fetch(API+'?id='+encodeURIComponent(candidate)+'&t='+Date.now(),{headers:{Accept:'application/json'},cache:'no-store'});const data=await response.json();if(!response.ok||!data?.ok||!data?.player)throw new Error(data?.error||'profile');return data}
async function load(){if(localStorage.getItem('kor1816_member_ok')!=='1816:KOR'){location.replace('./profile-preview.html?return=home');return}id=localStorage.getItem('kor1816_member_game_id')||sessionStorage.getItem('kor1816_member_game_id')||'';if(!/^\d{4,20}$/.test(id)){$('status').textContent=T.noid;$('linkForm').hidden=false;$('refresh').disabled=true;return}$('linkForm').hidden=true;$('refresh').disabled=true;$('status').textContent=T.loading;try{renderProfile(await fetchProfile(id))}catch(e){$('status').textContent=T.failed+' ('+e.message+')'}finally{$('refresh').disabled=false}}
$('linkForm').addEventListener('submit',async e=>{e.preventDefault();const candidate=$('linkId').value.trim();if(!/^\d{4,20}$/.test(candidate)){$('status').textContent='게임 ID는 숫자 4~20자리로 입력해 주세요.';return}const submit=$('linkSubmit');submit.disabled=true;$('status').textContent='서버와 연맹 소속을 확인하고 있습니다…';try{const data=await fetchProfile(candidate),p=data.player,a=p.alliance||{};if(String(p.kid)!=='1816'||String(a.abbr||a.tag||'')!=='KOR')throw new Error(T.linkError);localStorage.setItem('kor1816_member_game_id',candidate);sessionStorage.setItem('kor1816_member_game_id',candidate);await load()}catch(err){$('status').textContent=err.message||T.failed}finally{submit.disabled=false}});
$('refresh').addEventListener('click',load);load();
</script></body></html>
