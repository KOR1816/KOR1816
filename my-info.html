<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0b1020"><title>KOR1816 | 내정보</title>
<style>
:root{color-scheme:dark;--bg:#080d18;--panel:#101a2e;--line:#30496f;--gold:#e5b84b;--text:#f4f7ff;--muted:#aebbd3;--blue:#91d3ff}
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 50% -15%,#1a2b49 0,#0b1020 54%);color:var(--text);font-family:Arial,"Malgun Gothic",sans-serif}.wrap{width:min(1100px,100%);margin:auto;padding:18px 14px 40px}.top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;padding:8px 0 18px;border-bottom:1px solid #293b5a}.brand{font-size:20px;font-weight:900;letter-spacing:.04em}.brand small{display:block;color:var(--muted);font-size:12px;font-weight:400;margin-top:5px}.actions{display:flex;align-items:center;gap:8px;flex-wrap:wrap}button,.link{display:inline-flex;align-items:center;justify-content:center;border:1px solid #405a80;border-radius:10px;background:#111c31;color:var(--text);padding:10px 13px;font-weight:800;text-decoration:none;cursor:pointer}button.primary{background:linear-gradient(135deg,#e9cb7b,#b78a36);color:#182033;border-color:#e9cb7b}button:disabled{opacity:.55;cursor:wait}.hero{margin:18px 0;padding:22px;border:1px solid var(--line);border-radius:16px;background:linear-gradient(145deg,#16233d,#0c1425)}h1{font-size:clamp(24px,4vw,34px);margin:0 0 8px;color:#f7d77a}.muted{color:var(--muted);line-height:1.6}.status{margin-top:12px;color:var(--blue);font-size:13px;white-space:pre-wrap}.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin:14px 0}.stat,.panel{border:1px solid var(--line);border-radius:13px;background:linear-gradient(145deg,#16233d,#0c1425);padding:14px;min-width:0}.stat span{display:block;color:var(--muted);font-size:12px;margin-bottom:8px}.stat strong{font-size:clamp(15px,2.5vw,21px);overflow-wrap:anywhere}.section-title{margin:24px 0 10px;font-size:20px;color:#f7d77a}.gear-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}.gear{border:1px solid #30496f;border-radius:12px;background:#0b1425;padding:12px;min-width:0}.gear h3{margin:0 0 8px;font-size:14px;color:#e9cb7b;overflow-wrap:anywhere}.gear pre,.raw{margin:0;white-space:pre-wrap;overflow-wrap:anywhere;font:12px/1.55 ui-monospace,monospace;color:#cbd8ea}.empty{padding:18px;border:1px dashed #405a80;border-radius:12px;color:var(--muted);line-height:1.6}.raw-wrap{margin-top:18px}.raw-wrap summary{cursor:pointer;color:var(--blue);padding:10px 0}.foot{margin-top:22px;color:#8295b5;font-size:12px;text-align:center}@media(max-width:760px){.stats{grid-template-columns:repeat(2,minmax(0,1fr))}.gear-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.hero{padding:16px}}@media(max-width:420px){.gear-grid{grid-template-columns:minmax(0,1fr)}.brand{font-size:17px}}
</style></head><body><main class="wrap"><header class="top"><div class="brand">KOR1816<small>개인 게임 프로필 · My Info</small></div><div class="actions"><a class="link" id="back" href="./index.html?space=1816#home">← 메인으로</a><button class="primary" id="refresh">↻ 정보 새로고침</button></div></header>
<section class="hero"><h1 id="playerName">내정보</h1><div class="muted" id="playerMeta">로그인한 게임 ID의 공개 프로필을 조회합니다.</div><div class="status" id="status" role="status" aria-live="polite">프로필을 준비하고 있습니다…</div><form id="linkForm" class="panel" hidden style="margin-top:14px"><label for="linkId" class="muted">기존 로그인 기록에 게임 ID가 저장되지 않은 경우 한 번만 입력해 주세요. 서버 1816 및 연맹 KOR 확인 후 저장합니다.</label><div class="actions" style="margin-top:10px"><input id="linkId" inputmode="numeric" autocomplete="off" placeholder="킹샷 게임 ID" required style="flex:1;min-width:180px"><button class="primary" id="linkSubmit" type="submit">ID 확인 및 연결</button></div></form></section>
<div class="stats" id="stats"></div><h2 class="section-title">영주 장비</h2><div id="lordGear" class="gear-grid"></div><h2 class="section-title">영웅 장비</h2><div id="heroGear" class="gear-grid"></div><h2 class="section-title">순위 정보</h2><div id="ranks" class="stats"></div><details class="raw-wrap"><summary>조회된 원본 정보 확인</summary><pre id="raw" class="raw"></pre></details><p class="foot">프로필 정보는 제공 API의 갱신 주기에 따라 지연될 수 있습니다. 순위는 실제 비교 데이터가 제공되는 항목만 표시합니다.</p></main>
<script>
const API='https://kor1816-api.to1ggi8410.workers.dev/api/profile';
const $=id=>document.getElementById(id);
const params=new URLSearchParams(location.search);
const lang=params.get('lang')||localStorage.getItem('kor1816_rebuild_lang_v1')||'ko';
const WORDS={ko:{back:'← 메인으로',refresh:'↻ 정보 새로고침',loading:'최신 프로필 정보를 조회하고 있습니다…',noid:'저장된 로그인 게임 ID가 없습니다. 메인 로그인 화면에서 다시 확인해 주세요.',failed:'정보를 불러오지 못했습니다. 잠시 후 다시 시도해 주세요.',unknown:'정보 없음',lord:'영주 장비',hero:'영웅 장비',ranks:'순위 정보',last:'마지막 조회',power:'전투력',level:'센터 레벨',trial:'시련 점수',mystery:'신비 점수',kingdom:'서버',alliance:'연맹',nickname:'닉네임',id:'게임 ID',rank:'순위'},en:{back:'← Home',refresh:'↻ Refresh Info',loading:'Fetching latest profile…',noid:'No saved login Game ID. Return to the login page and verify again.',failed:'Could not load profile. Please try again.',unknown:'Not available',power:'Power',level:'Center Level',trial:'Trial Score',mystery:'Mystery Score',kingdom:'Kingdom',alliance:'Alliance',nickname:'Nickname',id:'Game ID',rank:'Rank'},ja:{back:'← ホーム',refresh:'↻ 情報を更新',loading:'最新プロフィールを取得中…',noid:'保存されたゲームIDがありません。ログイン画面で再確認してください。',failed:'情報を取得できませんでした。再試行してください。',unknown:'情報なし',power:'戦力',level:'センターレベル',trial:'試練スコア',mystery:'神秘スコア',kingdom:'王国',alliance:'同盟',nickname:'名前',id:'ゲームID',rank:'順位'},zh:{back:'← 首页',refresh:'↻ 刷新信息',loading:'正在获取最新资料…',noid:'没有保存的游戏 ID，请返回登录页重新验证。',failed:'无法获取资料，请稍后重试。',unknown:'暂无信息',power:'战力',level:'中心等级',trial:'试炼分数',mystery:'神秘分数',kingdom:'王国',alliance:'联盟',nickname:'昵称',id:'游戏 ID',rank:'排名'},de:{back:'← Startseite',refresh:'↻ Informationen aktualisieren',loading:'Aktuelles Profil wird geladen…',noid:'Keine gespeicherte Spiel-ID. Bitte erneut anmelden.',failed:'Profil konnte nicht geladen werden.',unknown:'Nicht verfügbar',power:'Kampfkraft',level:'Zentrumstufe',trial:'Prüfungspunktzahl',mystery:'Mystikpunkte',kingdom:'Königreich',alliance:'Allianz',nickname:'Name',id:'Spiel-ID',rank:'Rang'},it:{back:'← Home',refresh:'↻ Aggiorna informazioni',loading:'Caricamento profilo aggiornato…',noid:'Nessun ID salvato. Accedi di nuovo.',failed:'Impossibile caricare il profilo.',unknown:'Non disponibile',power:'Potenza',level:'Livello centro',trial:'Punteggio prova',mystery:'Punteggio mistero',kingdom:'Regno',alliance:'Alleanza',nickname:'Nome',id:'ID gioco',rank:'Posizione'},es:{back:'← Inicio',refresh:'↻ Actualizar información',loading:'Consultando el perfil actualizado…',noid:'No hay ID guardado. Inicia sesión de nuevo.',failed:'No se pudo cargar el perfil.',unknown:'No disponible',power:'Poder',level:'Nivel del centro',trial:'Puntuación de prueba',mystery:'Puntuación misteriosa',kingdom:'Reino',alliance:'Alianza',nickname:'Nombre',id:'ID de juego',rank:'Rango'},tr:{back:'← Ana sayfa',refresh:'↻ Bilgileri yenile',loading:'Güncel profil alınıyor…',noid:'Kayıtlı oyun kimliği yok. Yeniden giriş yapın.',failed:'Profil alınamadı.',unknown:'Bilgi yok',power:'Güç',level:'Merkez seviyesi',trial:'Deneme puanı',mystery:'Gizem puanı',kingdom:'Krallık',alliance:'İttifak',nickname:'Takma ad',id:'Oyun kimliği',rank:'Sıra'}};
const T=WORDS[lang]||WORDS.ko;
$('back').textContent=T.back;$('refresh').textContent=T.refresh;
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function first(obj,keys){for(const k of keys){if(obj&&obj[k]!==undefined&&obj[k]!==null&&obj[k]!=='')return obj[k]}return null}
function fmt(v){if(v===null||v===undefined||v==='')return T.unknown;if(typeof v==='number')return v.toLocaleString();if(typeof v==='object')return JSON.stringify(v);return String(v)}
function metric(label,value){return '<div class="stat"><span>'+esc(label)+'</span><strong>'+esc(fmt(value))+'</strong></div>'}
function itemList(value){if(Array.isArray(value))return value;if(value&&typeof value==='object'){for(const k of ['items','equipment','equipments','gears','list','slots'])if(Array.isArray(value[k]))return value[k];return Object.entries(value).map(([slot,v])=>v&&typeof v==='object'?{slot,...v}:{slot,value:v})}return []}
function cleanObject(obj){if(!obj||typeof obj!=='object')return obj;const omit=new Set(['raw','raw_json','payload','response']);return Object.fromEntries(Object.entries(obj).filter(([k,v])=>!omit.has(k.toLowerCase())&&typeof v!=='function'))}
function gearCard(item,index){const o=cleanObject(item&&typeof item==='object'?item:{value:item});const title=first(o,['name','title','slot','type','part','equipment_name','equipmentName','hero_name','heroName'])||('장비 '+(index+1));const main=Object.entries(o).filter(([k,v])=>v!==null&&v!==undefined&&typeof v!=='object'&&!/url|image|icon|id$/i.test(k)).map(([k,v])=>k+': '+fmt(v)).join('\n');let image=first(o,['image','image_url','imageUrl','icon','icon_url','iconUrl','img','url']);if(typeof image==='object')image=first(image,['url','src']);return '<div class="gear"><h3>'+esc(title)+'</h3>'+(typeof image==='string'&&/^https?:\/\//i.test(image)?'<img alt="" src="'+esc(image)+'" style="width:54px;height:54px;object-fit:contain;display:block;margin:0 auto 8px">':'')+'<pre>'+esc(main||JSON.stringify(o,null,2))+'</pre></div>'}
function renderGear(root,raw,emptyText){const items=itemList(raw);root.innerHTML=items.length?items.map(gearCard).join(''):'<div class="empty">'+esc(emptyText)+'</div>'}
function deepFind(obj,keys,depth=0){if(!obj||typeof obj!=='object'||depth>5)return null;const map=new Map(Object.keys(obj).map(k=>[k.toLowerCase().replace(/[^a-z0-9가-힣]/g,''),k]));for(const wanted of keys){const k=map.get(wanted.toLowerCase().replace(/[^a-z0-9가-힣]/g,''));if(k!==undefined&&obj[k]!==null&&obj[k]!==''&&typeof obj[k]!=='object')return obj[k]}for(const v of Object.values(obj)){if(v&&typeof v==='object'){const found=deepFind(v,keys,depth+1);if(found!==null&&found!==undefined&&found!=='')return found}}return null}
function findSection(obj,keys){return first(obj,keys)||deepFind(obj,keys)}
function renderProfile(data){const p=data.player||data.profile||data;const alliance=p.alliance||{};const name=first(p,['nickname','name','player_name','playerName','governor_name'])||'KOR1816';$('playerName').textContent=fmt(name);$('playerMeta').textContent=T.id+': '+id+' · '+T.kingdom+': '+fmt(first(p,['kid','kingdom_id','kingdomId','kingdom'])||first(alliance,['kid','kingdom']))+' · '+T.alliance+': '+fmt(first(alliance,['abbr','tag','name'])||first(p,['alliance_tag','allianceTag']));const power=findSection(p,['power','power_value','total_power','totalPower','combat_power','combatPower']);const level=findSection(p,['center_level','centerLevel','town_center_level','townCenterLevel','city_level','cityLevel','building_level','buildingLevel']);const trial=findSection(p,['trial_score','trialScore','trial_points','trialPoints','trial_tower_score','trialTowerScore']);const mystery=findSection(p,['mystery_score','mysteryScore','mystic_score','mysticScore','mystery_points','mysteryPoints']);$('stats').innerHTML=[metric(T.power,power),metric(T.level,level),metric(T.trial,trial),metric(T.mystery,mystery)].join('');const gov=findSection(data,['gov_gear','govGear','governor_gear','governorGear','governor_equipment','governorEquipment','lord_equipment','lordEquipment']);renderGear($('lordGear'),gov,'현재 API 응답에 영주 장비 정보가 없습니다.');let heroes=findSection(data,['heroes','hero_list','heroList','hero_info','heroInfo','hero_data','heroData']);if(!heroes)heroes=findSection(p,['heroes','hero_list','heroList','hero_info','heroInfo','hero_data','heroData']);const heroList=Array.isArray(heroes)?heroes:(heroes&&typeof heroes==='object'?Object.values(heroes):[]);const gear=[];for(const h of heroList){if(!h||typeof h!=='object')continue;const hn=first(h,['nickname','name','hero_name','heroName','title'])||'영웅';const hg=first(h,['gear','equipment','equipments','hero_gear','heroGear']);const list=itemList(hg);if(list.length)for(const g of list)gear.push({...g,hero_name:hn});else if(hg)gear.push({hero_name:hn,equipment:hg})}renderGear($('heroGear'),gear,'현재 API 응답에 영웅 장비 정보가 없습니다.');const ranks=findSection(data,['ranks','rank','ranking','rankings']);const rankItems=itemList(ranks);$('ranks').innerHTML=rankItems.length?rankItems.map((r,i)=>metric(first(r,['name','type','category','label'])||('Rank '+(i+1)),first(r,['rank','position','value','score'])||r)).join(''):'<div class="empty">API가 제공하는 순위 데이터가 없거나, 99명 전체를 비교할 자료가 없습니다. 확인되지 않은 순위는 표시하지 않습니다.</div>';$('raw').textContent=JSON.stringify(data,null,2)}
let id='';async function load(){if(localStorage.getItem('kor1816_member_ok')!=='1816:KOR'){location.replace('./profile-preview.html?return=home');return}id=localStorage.getItem('kor1816_member_game_id')||sessionStorage.getItem('kor1816_member_game_id')||'';if(!/^\d{4,20}$/.test(id)){$('status').textContent=T.noid;$('refresh').disabled=true;return}$('refresh').disabled=true;$('status').textContent=T.loading;try{const response=await fetch(API+'?id='+encodeURIComponent(id)+'&t='+Date.now(),{headers:{Accept:'application/json','Cache-Control':'no-cache'}});const data=await response.json();if(!response.ok||!data||!data.ok||!(data.player||data.profile))throw new Error(data?.error||'profile');renderProfile(data);$('status').textContent=T.last+': '+new Date().toLocaleString()+' · 조회 성공'}catch(e){$('status').textContent=T.failed+' ('+e.message+')'}finally{$('refresh').disabled=false}}
$('linkForm').addEventListener('submit',async e=>{e.preventDefault();const candidate=$('linkId').value.trim();if(!/^\\d{4,20}$/.test(candidate)){$('status').textContent='게임 ID는 숫자 4~20자리로 입력해 주세요.';return}const submit=$('linkSubmit');submit.disabled=true;$('status').textContent='서버와 연맹 소속을 확인하고 있습니다…';try{const res=await fetch(API+'?id='+encodeURIComponent(candidate)+'&t='+Date.now(),{headers:{Accept:'application/json','Cache-Control':'no-cache'}});const data=await res.json();if(!res.ok||!data?.ok||!data?.player)throw new Error('프로필을 찾을 수 없습니다.');const p=data.player,alliance=p.alliance||{},kr=String(p.kid??p.kingdom_id??p.kingdomId??p.kingdom??'').replace(/^Kingdom\\s*/i,'').trim(),tag=String(alliance.abbr??alliance.tag??p.alliance_tag??'').trim();if(kr!=='1816'||tag!=='KOR')throw new Error('서버 1816 및 연맹 KOR 소속이 확인되지 않았습니다.');localStorage.setItem('kor1816_member_game_id',candidate);sessionStorage.setItem('kor1816_member_game_id',candidate);$('status').textContent='ID 연결 완료. 최신 정보를 불러옵니다…';await load()}catch(err){$('status').textContent=err.message||T.failed}finally{submit.disabled=false}});$('refresh').addEventListener('click',load);load();
</script></body></html>
