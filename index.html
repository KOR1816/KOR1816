async function translateDynamicText(text,lang){
 if(!text||lang==="ko")return text||"";
 const targetLang=lang==="zh"?"zh-CN":lang;
 const services=[
  "https://api.mymemory.translated.net/get?q="+encodeURIComponent(text)+"&langpair=ko|"+encodeURIComponent(targetLang),
  "https://translate.googleapis.com/translate_a/single?client=gtx&sl=ko&tl="+encodeURIComponent(targetLang)+"&dt=t&q="+encodeURIComponent(text)
 ];
 for(const url of services){
  try{
   const response=await fetch(url,{mode:"cors",cache:"no-store"});
   if(!response.ok)continue;
   const data=await response.json();
   const translated=data?.responseData?.translatedText|| (Array.isArray(data?.[0])?data[0].map(part=>part?.[0]||"").join(""):"");
   if(translated&&translated!==text)return translated;
  }catch(error){console.warn("Translation service unavailable",error)}
 }
 return text;
}

 const source=homeData.translations.ko||DEFAULTS.ko;
 const target={...(homeData.translations[lang]||DEFAULTS[lang])};
 const fields=["latestTitle","latestBody","schedule","welcome"];
 for(const field of fields){
  const sourceText=String(source[field]??"");
  const defaultSource=String(DEFAULTS.ko[field]??"");
  const targetText=String(target[field]??"");
  const defaultTarget=String(DEFAULTS[lang][field]??"");
  if(sourceText && sourceText!==defaultSource && (!targetText||targetText===defaultTarget)){
   const translated=await translateDynamicText(sourceText,lang);
   if(currentLang!==lang)return;
   if(translated&&translated!==sourceText)target[field]=translated;
  }
 }
 homeData.translations[lang]=target;
 renderHome();
}
function renderHome(){
 const d=currentData(),ui=UI[currentLang];
 el("homeLatestTitle").textContent="📢 "+(d.latestTitle||ui.latest.replace(/^📢\s*/,""));
 el("homeLatest").textContent=d.latestBody||"";
 el("homeScheduleTitle").textContent=ui.schedule;
 el("homeSchedule").replaceChildren(...safeText(d.schedule).split("\n").map(line=>{const p=document.createElement("p");p.textContent=line;return p}));
 el("homeWelcomeTitle").textContent=ui.welcome;
 el("homeWelcome").textContent=d.welcome||"";
 el("languageLabel").textContent=ui.lang;
 el("homeRefreshBtn").textContent=ui.refresh;
 el("homeAdminBtn").textContent=homeAdmin?ui.close:ui.admin;
 el("homeSaveBtn").textContent=ui.save;
 el("editLatestHeading").textContent=ui.editLatest;
 el("editScheduleHeading").textContent=ui.editSchedule;
 el("latestTitleLabel").textContent=ui.title;
 el("latestBodyLabel").textContent=ui.content;
 el("scheduleLabel").textContent=ui.scheduleLabel;
 el("welcomeLabel").textContent=ui.welcomeLabel;
 el("discordDescription").textContent=ui.discord;
 el("homeLatestInput").value=d.latestTitle||"";
 el("homeLatestBody").value=d.latestBody||"";
 el("homeScheduleInput").value=d.schedule||"";
 el("homeWelcomeInput").value=d.welcome||"";
 document.documentElement.lang=currentLang==="zh"?"zh-CN":currentLang;
}
function setMessage(key){el("homeMsg").textContent=UI[currentLang][key]||""}
async function refreshHome(){
 const local=localRead();
 if(local)homeData=mergeData(local);
 renderHome();
 try{
   if(!homeDoc)throw new Error("Firestore not ready");
   const snap=await getDoc(homeDoc);
   if(snap.exists()){
     const cloud=snap.data()||{},localStamp=Number(local&&local._updatedAt)||0,cloudStamp=Number(cloud.updatedAt)||0;
     if(localStamp>cloudStamp){await setDoc(homeDoc,{...homeData,updatedAt:localStamp});}
     else{homeData=mergeData(cloud);localWrite({...homeData,_updatedAt:cloudStamp});}
   }else if(!local){await setDoc(homeDoc,{...homeData,updatedAt:Date.now()});}
   renderHome();setMessage("loaded");
 }catch(err){console.warn("Home refresh:",err);setMessage("");}
}
async function ensureAdmin(){
 try{
  let user=auth?.currentUser;
  if(!user||!user.email){const result=await signInWithPopup(auth,new GoogleAuthProvider());user=result.user}
  if(!user?.email||!ADMIN_EMAILS.includes(user.email.toLowerCase())){
    alert(UI[currentLang].denied);
    try{await signOut(auth);await signInAnonymously(auth)}catch{}
    return false;
  }
  return true;
 }catch(err){console.warn("Admin sign-in:",err);alert(UI[currentLang].login);return false}
}
el("languageSelect").addEventListener("change",event=>{
 currentLang=event.target.value;
 try{localStorage.setItem("kor1816_lang",currentLang)}catch{}
 renderHome();setMessage("");
 void translateHomeDynamic(currentLang);
});
el("homeRefreshBtn").addEventListener("click",refreshHome);
el("homeAdminBtn").addEventListener("click",async()=>{
 if(!homeAdmin){if(!await ensureAdmin())return;homeAdmin=true}
 else homeAdmin=false;
 el("homeView").hidden=homeAdmin;
 el("homeEdit").classList.toggle("active",homeAdmin);
 el("homeSaveBtn").hidden=!homeAdmin;
 renderHome();
});
el("homeSaveBtn").addEventListener("click",async()=>{
 const edited={latestTitle:el("homeLatestInput").value.trim(),latestBody:el("homeLatestBody").value,schedule:el("homeScheduleInput").value,welcome:el("homeWelcomeInput").value};
 homeData=mergeData(homeData);homeData.translations[currentLang]={...homeData.translations[currentLang],...edited};
 if(currentLang==="ko")Object.assign(homeData,edited);
 localWrite(homeData);renderHome();
 try{
  if(!homeDoc)throw new Error("Firestore not ready");
  await setDoc(homeDoc,{...homeData,updatedAt:Date.now()});
  setMessage("saved");
 }catch(err){console.error("Home save:",err);setMessage("localOnly")}
});
try{
 const savedLang=localStorage.getItem("kor1816_lang");
 if(savedLang&&UI[savedLang])currentLang=savedLang;
 el("languageSelect").value=currentLang;
 const app=initializeApp(firebaseConfig);auth=getAuth(app);db=getFirestore(app);homeDoc=doc(db,"siteData","home");
 try{await signInAnonymously(auth)}catch(err){console.warn("Anonymous auth:",err)}
}catch(err){console.error("Firebase init:",err)}
await refreshHome();
renderHome();
if(currentLang!=="ko")void translateHomeDynamic(currentLang);
</script>
</body>
</html>
