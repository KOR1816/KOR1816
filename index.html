<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>KOR1816 | Kingdom 1816</title><style>body{margin:0;background:#080d18;color:#f4f7ff;font-family:Arial,'Malgun Gothic',sans-serif}header{text-align:center;padding:25px;background:#172b4e}nav,.lang-switch{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;padding:10px;background:#0b1222;position:sticky;top:0;z-index:5}button{cursor:pointer;color:#fff;background:#243a61;border:1px solid #49688f;border-radius:9px;padding:8px 12px}.wrap{max-width:1050px;margin:auto;padding:20px}.page{display:none}.page.active{display:block}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:15px}.card{background:#101a2e;border:1px solid #30496f;border-radius:16px;padding:20px}.sword-image{max-width:100%;display:block;margin:auto;border-radius:12px}.home-area,.home-input,input,textarea{width:100%;box-sizing:border-box;padding:10px;background:#0b1426;color:#fff;border:1px solid #38547d;border-radius:8px;margin:6px 0 12px}.home-area{min-height:120px;resize:vertical}.msg{text-align:center;min-height:22px;color:#7fe6d5}.admin-bar{display:flex;justify-content:flex-end;gap:8px;margin:10px 0}.team-columns{display:grid;grid-template-columns:repeat(6,minmax(125px,1fr));gap:10px;min-width:860px}.team-columns-wrap{overflow-x:auto}.team-column{background:#111a30;border:1px solid #365783;border-radius:14px;padding:10px}.team-title{text-align:center;padding:10px;background:#202f52;border-radius:10px}.slot{display:flex;gap:5px;margin:6px 0}.slot span{width:20px;text-align:center}.slot input{min-width:0;margin:0}.alliance-teams{display:grid;grid-template-columns:repeat(2,1fr);gap:28px}.alliance-team{background:#111a30;border:2px solid #283f70;border-radius:16px;padding:16px}.alliance-names{display:grid;grid-template-columns:repeat(5,1fr)}.alliance-names input{margin:0;border-radius:0;border-right:0}.alliance-names input:last-child{border-right:1px solid #38547d}.rules-text-full{white-space:pre-wrap;line-height:1.7;min-height:420px}.castle-text{white-space:pre-wrap}@media(max-width:700px){.grid,.alliance-teams{grid-template-columns:1fr}.team-columns{grid-template-columns:repeat(6,minmax(125px,1fr))}}</style></head><body><div class="lang-switch"><button onclick="setLang('ko')">🇰🇷 한국어</button><button onclick="setLang('en')">🇺🇸 English</button><button onclick="setLang('ja')">🇯🇵 日本語</button><button onclick="setLang('zh')">🇨🇳 中文</button><button onclick="setLang('de')">🇩🇪 Deutsch</button></div><header><h1>🏰 KOR1816</h1><div class="sub">Kingdom 1816 · 건들면 문다! · 곰친자들의 모임!!</div></header><nav><button data-nav="home" onclick="show('home')">🏠 홈</button><button data-nav="viking" onclick="show('viking')">🛡️ 바이킹</button><button data-nav="teams" onclick="show('teams')">⚔️ 성검쟁탈</button><button data-nav="alliance" onclick="show('alliance')">⚔️ 3대연맹전</button><button data-nav="castle" onclick="show('castle')">🏰 공성전</button><button data-nav="bear" onclick="show('bear')">🐻 곰사냥</button><button data-nav="rules" onclick="show('rules')">📋 규칙</button></nav><main class="wrap"><section id="home" class="page active"><img src="./1816.jpg?v=2" class="sword-image"><div id="homeMsg" class="msg"></div><div id="homeView" class="grid"><div class="card"><h2>📢 공지</h2><div id="homeLatest"></div></div><div class="card"><h2>📅 공지 일정</h2><div id="homeSchedule"></div></div><div class="card"><h2>🌍 Kingdom 1816</h2><div id="homeWelcome"></div></div></div><div class="admin-bar"><button onclick="toggleHomeAdmin()" id="homeAdminBtn">🔐 관리자 수정</button></div><div id="homeEdit" class="grid" style="display:none"><div class="card"><label>공지 제목</label><input id="homeLatestInput"><label>공지 내용</label><textarea id="homeLatestBody" class="home-area"></textarea></div><div class="card"><label>일정</label><textarea id="homeScheduleInput" class="home-area"></textarea></div><div class="card"><label>환영 문구</label><textarea id="homeWelcomeInput" class="home-area"></textarea></div><div class="card"><button onclick="saveHome()">💾 홈 저장</button></div></div></section><section id="viking" class="page"><div id="vikingMsg" class="msg"></div><div id="vikingView" class="grid"><div class="card"><h2 id="vikingTitle1">🛡️ 바이킹 안내</h2><div id="vikingText1"></div></div><div class="card"><h2 id="vikingTitle2">⚔️ 바이킹 진행</h2><div id="vikingText2"></div></div><div class="card"><h2 id="vikingTitle3">👥 바이킹 편성</h2><div id="vikingText3"></div></div><div class="card"><h2 id="vikingTitle4">📋 바이킹 규칙</h2><div id="vikingText4"></div></div></div><div class="admin-bar"><button onclick="toggleVikingAdmin()" id="vikingAdminBtn">🔐 관리자 수정</button></div><div id="vikingEdit" class="grid" style="display:none"></div></section><section id="teams" class="page"><div class="card"><h2>⚔️ 성검쟁탈</h2><div class="team-columns-wrap"><div class="team-columns" id="teamCols"></div></div></div><div class="admin-bar"><button onclick="refreshTeams()">🔄 새로고침</button><button onclick="toggleTeamAdmin()" id="teamAdminBtn">🔐 관리자 수정</button></div></section><section id="alliance" class="page"><div class="card"><h2>⚔️ 3대연맹전</h2><div class="alliance-teams" id="allianceView"></div><div class="admin-bar"><button onclick="toggleAllianceAdmin()" id="allianceAdminBtn">🔐 관리자 수정</button></div></div></section><section id="castle" class="page"><div id="castleMsg" class="msg"></div><div id="castleView" class="grid"><div class="card"><h2 id="castleTitle1">⚔️ 집결장 공격</h2><div id="castleText1" class="castle-text"></div></div><div class="card"><h2 id="castleTitle2">🛡️ 수성</h2><div id="castleText2" class="castle-text"></div></div><div class="card"><h2 id="castleTitle3">👥 집결원 공격</h2><div id="castleText3" class="castle-text"></div></div><div class="card"><h2 id="castleTitle4">👥 집결원 수성</h2><div id="castleText4" class="castle-text"></div></div></div><div class="admin-bar"><button onclick="toggleCastleAdmin()" id="castleAdminBtn">🔐 관리자 수정</button></div><div id="castleEdit" class="grid" style="display:none"></div></section><section id="bear" class="page"><div class="card"><h2>🐻 곰 사냥</h2><div id="bearText"></div></div><div class="admin-bar"><button onclick="toggleBearAdmin()" id="bearAdminBtn">🔐 관리자 수정</button></div></section><section id="rules" class="page"><div class="card"><h2>📋 KOR1816 운영 안내</h2><div id="rulesText" class="rules-text-full"></div></div><div class="admin-bar"><button onclick="toggleRulesAdmin()" id="rulesAdminBtn">🔐 관리자 수정</button></div></section></main><script>const ADMIN_PASSWORD='0001';let lang='ko';const T={ko:{nav:['🏠 홈','🛡️ 바이킹','⚔️ 성검쟁탈','⚔️ 3대연맹전','🏰 공성전','🐻 곰사냥','📋 규칙']},en:{nav:['🏠 Home','🛡️ Viking','⚔️ Holy Sword','⚔️ 3 Alliances','🏰 Castle Siege','🐻 Bear Hunt','📋 Rules']},ja:{nav:['🏠 ホーム','🛡️ バイキング','⚔️ 聖剣争奪','⚔️ 3大連盟戦','🏰 攻城戦','🐻 熊狩り','📋 ルール']},zh:{nav:['🏠 首页','🛡️ 维京','⚔️ 圣剑争夺','⚔️ 三大联盟战','🏰 攻城战','🐻 猎熊','📋 规则']},de:{nav:['🏠 Startseite','🛡️ Wikinger','⚔️ Heiliger Schwertkampf','⚔️ 3 Allianzen','🏰 Belagerung','🐻 Bärenjagd','📋 Regeln']}};function setLang(x){lang=x;localStorage.setItem('kor1816_lang',x);T[x]&&(document.querySelectorAll('[data-nav]').forEach((b,i)=>b.textContent=T[x].nav[i]));}function show(id){document.querySelectorAll('.page').forEach(x=>x.classList.remove('active'));document.getElementById(id).classList.add('active');}function pw(){return prompt('관리자 비밀번호를 입력하세요.')===ADMIN_PASSWORD}function toggleHomeAdmin(){if(!pw())return;document.getElementById('homeView').style.display='none';document.getElementById('homeEdit').style.display='grid'}function saveHome(){localStorage.setItem('home',JSON.stringify({a:homeLatestInput.value,b:homeLatestBody.value,c:homeScheduleInput.value,d:homeWelcomeInput.value}));renderHome()}function renderHome(){let d=JSON.parse(localStorage.getItem('home')||'{"a":"성검쟁탈 팀 편성","b":"대체자 10명","c":"⚔️ 성검쟁탈 · 23:00\\n🐻 곰 1트랩 · 23:00\\n🐻 곰 2트랩 · 09:10","d":"소통 · 협력 · 성장 · KVK 조직력을 중심으로 함께합니다."}');homeLatest.innerHTML='<b>'+d.a+'</b><br><br>'+d.b.replace(/\n/g,'<br>');homeSchedule.innerHTML=d.c.replace(/\n/g,'<br>');homeWelcome.textContent=d.d;homeLatestInput.value=d.a;homeLatestBody.value=d.b;homeScheduleInput.value=d.c;homeWelcomeInput.value=d.d}function toggleVikingAdmin(){if(!pw())return;document.getElementById('vikingView').style.display='none';document.getElementById('vikingEdit').style.display='grid'}function toggleTeamAdmin(){if(!pw())return;document.querySelectorAll('#teams input').forEach(x=>x.readOnly=false)}function refreshTeams(){renderTeams()}function renderTeams(){let d=JSON.parse(localStorage.getItem('teams')||'{}'),h='';['A','B','C','D'].forEach(t=>{h+='<div class="team-column"><div class="team-title">'+t+'팀</div>';for(let i=1;i<=7;i++)h+='<div class="slot"><span>'+i+'</span><input id="'+t+i+'" value="'+((d[t]||[])[i-1]||'')+'" placeholder="Player ID"></div>';h+='</div>'});h+='<div class="team-column"><div class="team-title">💥 개돌조</div></div><div class="team-column"><div class="team-title">🔄 대체자</div></div>';teamCols.innerHTML=h}function toggleAllianceAdmin(){if(pw())alert('3대연맹전 수정 모드')}function toggleCastleAdmin(){if(!pw())return;let h='';for(let i=1;i<=4;i++)h+='<div class="card"><label>제목</label><input id="ct'+i+'"><label>내용</label><textarea id="cc'+i+'" class="home-area"></textarea></div>';castleEdit.innerHTML=h;castleView.style.display='none';castleEdit.style.display='grid'}function toggleBearAdmin(){if(pw())alert('곰사냥 수정 모드')}function toggleRulesAdmin(){if(pw())alert('규칙 수정 모드')}renderHome();renderTeams();setLang(localStorage.getItem('kor1816_lang')||'ko');</script></body></html>
