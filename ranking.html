</style></head><body><main class="wrap"><header class="top"><span class="crest">K</span><div class="brand">KOR1816 · KINGDOM 1816<small>Kingdom 1816 · 건들면 문다! · 곰친자들의 모임!!</small></div><a class="btn" href="./index.html?space=1816#glory">← 메인으로</a></header><section class="hero"><h1 id="title">🏆 시련 점수 랭킹</h1><p id="desc">게임 API에서 조회한 시련 점수를 기준으로 1~99위를 자동 정렬합니다. 점수가 조회되지 않은 프로필은 순위에 포함되지 않습니다.</p></section><div class="toolbar"><strong id="count">99명 조회 준비</strong><button class="btn" id="refresh">🔄 새로고침</button></div><div class="status" id="status" role="status" aria-live="polite">랭킹 데이터를 불러오는 중…</div><section class="list" id="list"><div class="empty">랭킹 데이터를 불러오는 중…</div></section></main>
<script>
const IDS=["277646867","279366155","273178050","280841541","272302196","262615089","272947841","271532528","279072727","279234965","278136872","261763324","279367354","269885273","269230772","254167456","277220188","253430709","252823945","277809051","277630478","277565244","270257167","272337940","275747145","279498200","270726183","268217971","278661073","271966460","278531764","261778876","273258930","277088890","280660595","278759624","270879682","279367558","279562732","278466567","269372902","270443090","279218125","276336897","278416482","280661086","275985582","271688441","277711710","270254362","279137266","264548253","270680423","277383097","256940953","278366666","259097364","264023958","280825224","259425117","259861537","280186422","277350446","279333024","273229188","279776591","269017528","277695498","280431947","272631641","262795207","276323629","272852827","280578852","280644519","279956548","277548000","278416124","279612331","277546906","261799305","279136817","277941037","279285182","280479953","279629382","277252686","277531970","279972554","278530645","279908393","279662322","253577480","278498878","278530654","277170530","277269174","280825692","269869267"];
const API="https://kor1816-api.to1ggi8410.workers.dev/api/profile";
const $=id=>document.getElementById(id);
function first(o,keys){if(!o||typeof o!=="object")return undefined;for(const k of keys)if(o[k]!==undefined&&o[k]!==null&&o[k]!=="")return o[k];}
function deep(o,keys,d=0){if(!o||typeof o!=="object"||d>10)return undefined;const v=first(o,keys);if(v!==undefined)return v;for(const x of Object.values(o)){if(x&&typeof x==="object"){const r=deep(x,keys,d+1);if(r!==undefined)return r}}}
function scoreFrom(data){const root=data.data&&typeof data.data==="object"?data.data:data.result&&typeof data.result==="object"?data.result:data;const p=data.player||data.profile||root.player||root.profile||root;const keys=["mystic_trial","mysticTrial","mystic_trial_score","mysticTrialScore","mystic_trial_points","mysticTrialPoints","mystic_trial_progress","mysticTrialProgress","mystic_score","mysticScore","trial_score","trialScore","trial_points","trialPoints","mystic_trial_best_score","mysticTrialBestScore"];const metric=x=>{if(x&&typeof x==="object")return metric(first(x,["score","points","value","progress","current","total","best_score","bestScore","total_score","totalScore","current_points","currentPoints","best","rank_score","rankScore"]));return x??""};let value=first(p,keys)??first(root,keys)??first(data,keys)??deep(root,keys)??deep(data,keys);const ranks=first(p,["ranks","rankings","leaderboards"])||first(root,["ranks","rankings","leaderboards"])||first(data,["ranks","rankings","leaderboards"]);if(value===undefined&&ranks){if(Array.isArray(ranks)){const b=ranks.find(x=>/mystic[ _-]?trial|神秘/i.test(String(first(x,["name","key","type","label","title"])||"")));if(b)value=metric(b)}else value=first(ranks,["mystic_trial","mysticTrial","mystic_trial_score","mysticTrialScore"])}if(value===undefined&&ranks){const walk=(n,d=0)=>{if(!n||typeof n!=="object"||d>10)return;for(const [k,v] of Object.entries(n)){if(/mystic[ _-]?trial|mystictrial/i.test(k)){const z=metric(v);if(z!==""&&z!==undefined)return z}const z=walk(v,d+1);if(z!==""&&z!==undefined)return z}};value=walk(ranks)}const n=Number(String(metric(value)).replace(/[, ]/g,""));return Number.isFinite(n)&&n>=0?n:null}
function profile(data,id){const root=data.data&&typeof data.data==="object"?data.data:data.result&&typeof data.result==="object"?data.result:data;const p=data.player||data.profile||root.player||root.profile||root;let avatar=first(p,["avatar_url","avatarUrl","avatar","portrait","portrait_url","portraitUrl","icon","profile_image","profileImage","head_icon","headIcon"])||first(root,["avatar_url","avatarUrl","avatar","portrait","portrait_url","portraitUrl","icon","profile_image","profileImage","head_icon","headIcon"])||deep(root,["avatar_url","avatarUrl","portrait_url","portraitUrl","profile_image","profileImage","head_icon","headIcon"]);if(avatar&&typeof avatar==="object")avatar=first(avatar,["url","image_url","imageUrl","src","path","image","icon"]);if(avatar){avatar=String(avatar);if(!/^https?:\/\//i.test(avatar))avatar="https://www.mightpulse.com/"+avatar.replace(/^\/+ /,"").replace(/^\//,"")}return {id,nickname:String(first(p,["nick_name","nickName","nickname","name","player_name","playerName","ign"])||deep(p,["nick_name","nickName","nickname","player_name","playerName","ign","name"])||("Player "+id)),avatar:avatar||"",score:scoreFrom(data)}}

function esc(s){return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
async function load(){const btn=$("refresh");btn.disabled=true;$("status").textContent="99개 프로필에서 시련 점수를 조회 중…";$("list").innerHTML='<div class="empty">API 조회 중…</div>';let done=0;const rows=[];for(let i=0;i<IDS.length;i+=5){const batch=await Promise.all(IDS.slice(i,i+5).map(getOne));for(const p of batch)if(p&&p.score!==null)rows.push(p);done+=batch.length;$("count").textContent=done+" / "+IDS.length+"명 조회"}rows.sort((a,b)=>b.score-a.score||a.nickname.localeCompare(b.nickname));$("list").innerHTML="";if(!rows.length){$("list").innerHTML='<div class="empty">시련 점수 데이터를 가져오지 못했습니다. API 응답에 시련 점수가 포함되는지 확인해 주세요.</div>'}else rows.slice(0,99).forEach((p,i)=>{const el=document.createElement("article");el.className="item";el.innerHTML='<div class="rank">#'+(i+1)+'</div><div class="avatar">'+(p.avatar?'<img loading="lazy" src="'+esc(p.avatar)+'" alt="">':esc(p.nickname.slice(0,1).toUpperCase()))+'</div><div><div class="name">'+esc(p.nickname)+'</div><div class="id">ID '+esc(p.id)+'</div></div><div class="score"><small>시련 점수</small>'+p.score.toLocaleString("en-US")+'</div>'; $("list").append(el)});$("count").textContent=rows.length+"명 점수 확인";$("status").textContent=rows.length===99?"99명 점수 조회 완료":"점수 확인 "+rows.length+"명 · API에서 점수를 반환한 프로필만 표시";btn.disabled=false}
$("refresh").addEventListener("click",load);load();
</script></body></html>
